<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%}
body{background:#0a1628;color:#e2e8f0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{cursor:pointer}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0a1628}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px}
table{border-collapse:collapse;width:100%}
optgroup{color:#94a3b8;font-size:11px}
option{color:#e2e8f0;background:#071020}

/* Mobile bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#0d1f3c;border-top:1px solid #1e3a5f;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav>div{min-width:0}
.bottom-nav span:first-child{font-size:16px!important}
@media(max-width:768px){
  .bottom-nav{display:flex}
  .desktop-sidebar{display:none!important}
  .main-content{padding:16px 16px 80px!important}
  .header-title{font-size:13px!important}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .summary-grid{grid-template-columns:1fr 1fr!important}
  .rehab-amount{font-size:28px!important}
  .rehab-remaining{font-size:20px!important}
  .rehab-grid{grid-template-columns:1fr!important}
  .project-grid{grid-template-columns:1fr!important}
  .form-row{flex-direction:column!important}
  .action-row{flex-wrap:wrap!important}
  .desktop-table{display:none!important}
  .mobile-cards{display:block!important}
  .page-header{flex-direction:column!important;align-items:flex-start!important;gap:12px!important}
  .page-header-actions{width:100%}
  .page-header-actions button{width:100%}
}
.mobile-cards{display:none}

<style>

/* ═══ Foreman AI (BuildFlow) — template styles scoped to .bf, in the NPV navy theme ═══ */
.bf{
  --navy:#14294a; --navy-2:#1e3a5f; --navy-3:#2a4a7f; --navy-ink:#c3cfe2; --navy-mute:#7a9cc5;
  --gold:#d4a017; --gold-2:#e6b93a; --gold-soft:rgba(212,160,23,.13); --gold-ink:#e6b93a;
  --paper:#071020; --white:#0d1f3c; --ink:#e2e8f0; --muted:#7a9cc5; --line:#1e3a5f; --line-2:#132a4a;
  --ok:#34d399; --ok-bg:rgba(16,185,129,.16); --warn:#fbbf24; --warn-bg:rgba(245,158,11,.16); --bad:#f87171; --bad-bg:rgba(239,68,68,.16); --info:#7cb3ff; --info-bg:rgba(59,130,246,.18);
  --display:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif; --body:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark; color:var(--ink); font-size:14px; line-height:1.45;
}
.bf *{box-sizing:border-box}
.bf button{font:inherit;color:inherit}
.bf :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bf .brand{display:flex;align-items:center;gap:11px;min-width:0}
.bf .brand-ic{width:36px;height:36px;flex-shrink:0;border-radius:9px;background:var(--gold);color:var(--navy);font-family:var(--display);font-weight:700;font-size:19px;display:grid;place-items:center}
.bf .brand-name{color:#fff;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf .hdr-r{display:flex;align-items:center;gap:12px;flex-shrink:0}
.bf .demo-chip{display:flex;align-items:center;gap:8px;border:1px solid rgba(201,162,39,.45);color:var(--gold-2);border-radius:999px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600}
.bf .demo-chip button{background:var(--navy-2);border:1px solid var(--navy-3);color:var(--navy-ink);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer}
.bf .demo-chip button:hover{color:#fff}
.bf .bf-logo{height:34px;width:auto;display:block}
.bf .side-label{color:var(--navy-mute);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:16px 10px 6px}
.bf .side-label.ai{color:var(--gold-2);display:flex;align-items:center;gap:6px}
.bf .si{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--navy-ink);cursor:pointer;font-size:13.5px;font-weight:500}
.bf .si:hover{background:var(--navy-2);color:#fff}
.bf .si.on{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.bf .si.sub{padding:7px 10px 7px 38px;font-size:12.5px;color:var(--navy-mute)}
.bf .si.sub.on,.bf .si.sub:hover{color:#fff}
.bf .si .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.bf .si .cnt{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.bf .si .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bf .side-foot{margin-top:auto;padding:18px 10px 4px;color:var(--navy-mute);font-size:11px;line-height:1.5}
.bf .side-foot b{color:var(--gold-2);font-weight:600}
.bf .main{flex:1;overflow-y:auto;min-width:0}
.bf .wrap{max-width:1200px;margin:0 auto;padding:26px 26px 48px}
.bf .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.bf .ph-t{min-width:0}
.bf .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.bf .eyebrow.gold{color:var(--gold-ink)}
.bf h1.t{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:0;letter-spacing:-.015em;text-wrap:balance}
.bf h2.t{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.bf .sub{color:var(--muted);margin-top:5px}
.bf .muted{color:var(--muted)}
.bf .num{font-variant-numeric:tabular-nums}
.bf .card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.bf .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bf .grid{display:grid;gap:16px}
.bf .g-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.bf .g-split{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}
.bf .g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.bf .g-proj{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.bf .stack{display:flex;flex-direction:column;gap:16px}
.bf .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bf .kpi .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bf .kpi .v{font-family:var(--display);font-size:27px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bf .kpi .n{font-size:12.5px;color:var(--muted);margin-top:3px}
.bf .kpi .n.bad{color:var(--bad)}
.bf .kpi .n.ok{color:var(--ok)}
.bf .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--gold);color:var(--navy);border:1px solid var(--gold);border-radius:8px;padding:9px 15px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.bf .btn:hover{background:var(--gold-2);border-color:var(--gold-2)}
.bf .btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.bf .btn.navy:hover{background:var(--navy-2)}
.bf .btn.ghost{background:var(--white);border-color:var(--line);color:var(--ink);font-weight:600}
.bf .btn.ghost:hover{border-color:var(--navy-mute)}
.bf .btn.sm{padding:6px 11px;font-size:12.5px}
.bf .btn:disabled{opacity:.5;cursor:default}
.bf .lnk{background:none;border:0;padding:0;color:var(--info);font-weight:600;cursor:pointer;font-size:13px}
.bf .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center}
.bf .x:hover{background:var(--line-2);color:var(--bad)}
.bf .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:0;line-height:1.6}
.bf .pill.ok{background:var(--ok-bg);color:var(--ok)}
.bf .pill.warn{background:var(--warn-bg);color:var(--warn)}
.bf .pill.bad{background:var(--bad-bg);color:var(--bad)}
.bf .pill.info{background:var(--info-bg);color:var(--info)}
.bf .pill.mute{background:var(--line-2);color:var(--muted)}
.bf .pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.bf .pill.navy{background:var(--navy);color:#fff}
.bf button.pill{cursor:pointer}
.bf .bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bf .bar>i{display:block;height:100%;background:var(--navy);border-radius:99px}
.bf .bar>i.gold{background:var(--gold)}
.bf .bar>i.bad{background:var(--bad)}
.bf .bar>i.ok{background:var(--ok)}
.bf .lrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2);min-width:0}
.bf .lrow:first-child{border-top:0}
.bf .lrow .grow{flex:1;min-width:0}
.bf .lrow .tt{font-weight:600}
.bf .lrow .mt{font-size:12.5px;color:var(--muted);margin-top:2px}
.bf .over{color:var(--bad);font-weight:600}
.bf .empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.bf .tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.bf .tab{padding:10px 14px;border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.bf .tab:hover{color:var(--ink)}
.bf .tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.bf .chips{display:flex;gap:6px;flex-wrap:wrap}
.bf .chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.bf .chip:hover{color:var(--ink)}
.bf .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bf input,.bf select,.bf textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;color:var(--ink);background:var(--white)}
.bf textarea{resize:vertical;line-height:1.5}
.bf input:focus,.bf select:focus,.bf textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
.bf .f{display:grid;gap:5px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;min-width:0}
.bf .f input,.bf .f select,.bf .f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:14px}
.bf .form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.bf .form .full{grid-column:1/-1}
.bf .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.bf .aibox{background:var(--navy);color:#fff;border-radius:14px;padding:22px;position:relative;overflow:hidden;border:1px solid var(--navy-3)}
.bf .aibox::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.22),transparent 70%);pointer-events:none}
.bf .ai-tag{display:inline-flex;align-items:center;gap:6px;color:var(--gold-2);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.bf .aibox h2.t{color:#fff;margin-top:8px}
.bf .aibox ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px;position:relative;z-index:1}
.bf .aibox li{display:flex;gap:10px;align-items:flex-start;color:var(--navy-ink)}
.bf .aibox li b{color:#fff;font-weight:600}
.bf .aibox li .mk{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--gold)}
.bf .aibox li .mk.bad{background:#F07A7A}
.bf .aibox li .mk.ok{background:#6FCF97}
.bf .aibox li .lnk{color:var(--gold-2);margin-left:4px;font-size:12.5px}
.bf .aibox .btn.ghost{background:transparent;color:#fff;border-color:var(--navy-3)}
.bf .spark{color:var(--gold)}
.bf .feed{display:grid;gap:0}
.bf .feed .lrow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:var(--gold-soft);color:var(--gold-ink)}
.bf .pcard{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,transform .15s;text-align:left;font:inherit}
.bf .pcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.bf .pcard .nm{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25}
.bf .pcard .meta{font-size:12.5px;color:var(--muted)}
.bf .pcard .fig{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.bf .pcard .fig b{color:var(--ink);font-variant-numeric:tabular-nums}
.bf .phead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.bf .cat-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;font-size:13px}
.bf .cat-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bf .trow .chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:#fff}
.bf .trow .chk.on{background:var(--ok);border-color:var(--ok)}
.bf .trow.done .tt{text-decoration:line-through;color:var(--muted)}
.bf .tl{position:relative;display:grid;gap:4px}
.bf .tl-i{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.bf .tl-i::before{content:"";position:absolute;left:16px;top:30px;bottom:0;width:2px;background:var(--line)}
.bf .tl-i:last-child::before{display:none}
.bf .tl-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--white);display:grid;place-items:center;cursor:pointer;color:transparent}
.bf .tl-dot.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.bf .tl-dot.next{border-color:var(--gold)}
.bf .tbl-wrap{overflow-x:auto}
.bf table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.bf .tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.bf .tbl td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.bf .tbl td.r,.bf .tbl th.r{text-align:right}
.bf .qitem + .qitem{margin-top:16px}
.bf .qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.bf .qrow.acc{background:linear-gradient(90deg,var(--gold-soft),transparent);margin:0 -18px;padding:11px 18px}
.bf .vcard .nm{font-weight:700;font-size:15px}
.bf .vcard .ct{display:grid;gap:3px;font-size:13px;margin-top:10px;user-select:text}
.bf .stars{color:var(--gold);font-weight:700;font-size:12.5px}
.bf .auto{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bf .auto .grow{flex:1;min-width:220px}
.bf .sw{width:50px;height:28px;border-radius:999px;background:var(--line);border:0;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.bf .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.bf .sw.on{background:var(--gold)}
.bf .sw.on i{left:25px}
.bf .inbox{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.bf .ilist{padding:6px}
.bf .irow{display:block;width:100%;text-align:left;background:none;border:0;border-radius:9px;padding:12px;cursor:pointer;border-left:3px solid transparent}
.bf .irow:hover{background:var(--paper)}
.bf .irow.on{background:var(--paper);border-left-color:var(--gold)}
.bf .irow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bf .irow .nm{font-weight:700}
.bf .irow .tm{font-size:11.5px;color:var(--muted);white-space:nowrap}
.bf .irow .ms{font-size:12.5px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bf .irow .row{margin-top:7px}
.bf .bubble{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;line-height:1.55}
.bf .bubble.ai{background:var(--gold-soft);border-color:rgba(212,160,23,.4)}
.bf .writing{display:inline-flex;gap:4px;align-items:center}
.bf .writing i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}
.bf .writing i:nth-child(2){animation-delay:.15s}
.bf .writing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.bf .kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.bf .kcol{background:var(--line-2);border-radius:12px;padding:10px;min-height:120px}
.bf .kcol-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 10px;font-weight:700;font-size:13px}
.bf .kcol-h span{font-weight:600;color:var(--muted);font-size:12px}
.bf .kcard{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.bf .kcard select{margin-top:8px;padding:5px 8px;font-size:12.5px}
.bf .f .seg{justify-self:start;max-width:100%;overflow-x:auto}
.bf .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.bf .seg button{border:0;background:var(--white);padding:8px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.bf .seg button.on{background:var(--navy);color:#fff}

/* ═══════════════════════════════════════════════════════════════════════════════════════

   Tap anywhere on a date field → calendar opens. Switch month and year with the arrows or
   the dropdowns, tap a day, or use Today / Clear. You can also type a date (10/18/2026).
   The value stays "YYYY-MM-DD", exactly what the native field gave, so nothing that saves

  if(t==="yesterday"){ now.setDate(now.getDate()-1); return toIso(now); }

        boxShadow:"0 18px 50px rgba(0,0,0,.55)",padding:12,color:C.ink,fontFamily:"inherit",fontSize:13,userSelect:"none"}},

const isGeneralP = p => String(p.description||"").includes("No budget");
const isSoldP    = p => String(p.description||"").includes("Sold");
const cityOf     = p => (String(p.description||"").split("|")[0].split("—")[0].trim()) || "Richmond, VA";
const ACQ = ["Down Payment","Closing Costs","Loan Expenses"];
const PRI_IN  = {High:"High",Med:"Med",Medium:"Med",Low:"Low",Urgent:"High"};
const isoOf = v => { if(!v) return ""; if(typeof v==="string" && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10); const d=new Date(v); return isNaN(d.getTime())?"":iso(d); };

/* Build the read-only view Foreman works with. Composite ids (projectId|id) keep tasks and
   milestones unambiguous across projects. */
function buildDb(npv, pAll, fdb){
  const projects = (npv.projects||[]).map(p=>({
    id:String(p.id), name:p.name, area:p.name, address:p.name+", "+cityOf(p), city:cityOf(p),
    type:"Fix & Flip", status: isGeneralP(p)?"General":isSoldP(p)?"Completed":"Active", client:"",
    purchasePrice:parseFloat(p.purchasePrice)||0, rehabBudget:parseFloat(p.rehabBudget)||0,
  }));
  const pick = (key,pid) => (String(npv.activeId)===pid && npv.current && npv.current[key]) ? npv.current[key] : ((pAll[key]||{})[pid]||[]);
  const expenses=[], tasks=[], quotes=[], milestones=[];
  projects.forEach(p=>{
    pick("expenses",p.id).forEach(x=>expenses.push({id:x.id,projectId:p.id,date:isoOf(x.date),category:x.category,amount:parseFloat(x.amount)||0,vendor:x.vendor||"",notes:x.notes||"",description:x.description||""}));
    pick("tasks",p.id).forEach(t=>tasks.push({id:p.id+"|"+t.id,projectId:p.id,task:t.task,status:t.status||"To Do",priority:t.priority||"Med",assignee:t.assignee||"",due:isoOf(t.dueDate),category:t.category||"",milestone:t.milestone?p.id+"|"+t.milestone:"",raw:t}));
    pick("quotes",p.id).forEach(q=>quotes.push({id:q.id,projectId:p.id,item:q.item,vendor:q.vendor,amount:parseFloat(q.amount)||0,status:q.status||"Pending",category:q.category}));
    const st = (npv.allMsStatus||{})[p.id]||{};
    ((npv.allMilestones||{})[p.id]||[]).forEach(m=>milestones.push({id:p.id+"|"+m.id,projectId:p.id,title:m.week||"Milestone",date:isoOf(m.date),done:st[m.id]==="done",items:m.items||[]}));
  });
  const vendors = [];
  Object.keys(npv.vendors||{}).forEach(cat=>(npv.vendors[cat]||[]).forEach(v=>vendors.push({id:v.id,name:v.name,category:cat,phone:v.phone||"",email:v.email||"",notes:v.notes||"",rating:0})));
  return {projects,expenses,tasks,quotes,milestones,vendors,
    leads:fdb.leads||[], posts:fdb.posts||[], events:fdb.events||[], autopilot:!!fdb.autopilot, autoSocial:fdb.autoSocial||defaultAutoSocial(),
    social:fdb.social||{}, calError:fdb.calError||"", liveError:fdb.error||"", liveLoaded:!!fdb.loaded,
    deals:npv.dealLeads||[], pipeline:npv.mgmtMilestones||[], pipelineStatus:npv.mgmtMsStatus||{}, generalTasks:npv.mgmtTasks||[]};
}

const spentRehab = (db,pid) => db.expenses.filter(x=>x.projectId===pid && ACQ.indexOf(x.category)===-1).reduce((a,x)=>a+x.amount,0);
const spentAcq   = (db,pid) => db.expenses.filter(x=>x.projectId===pid && ACQ.indexOf(x.category)>-1).reduce((a,x)=>a+x.amount,0);
const pTasks = (db,pid) => db.tasks.filter(t=>t.projectId===pid);
const isOverdue = t => t.status!=="Done" && t.due && daysFrom(t.due)<0;
const openProjects = db => db.projects.filter(p=>p.status==="Active");
const projById = (db,id) => db.projects.find(p=>p.id===String(id));
const nextMilestone = (db,pid) => db.milestones.filter(m=>m.projectId===pid && !m.done && m.date).sort((a,b)=>a.date.localeCompare(b.date))[0];
const needsReply = db => db.leads.filter(l=>!l.reply || l.reply.status==="draft");

/* What the AI writer gets for a post (no street address, no money) */
function projSummary(db,p){
  const ts=pTasks(db,p.id), nm=nextMilestone(db,p.id), ms=db.milestones.filter(m=>m.projectId===p.id);
  const first = ms.map(m=>m.date).filter(Boolean).sort()[0];
  return {id:p.id,name:p.name,neighborhood:p.city,type:"Fix & flip renovation",status:p.status==="Completed"?"Completed (sold)":"In progress",
    scope:ts.slice(0,12).map(t=>String(t.task).split(" — ")[0]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,8),
    tasksDone:ts.filter(t=>t.status==="Done").length,tasksTotal:ts.length,nextMilestone:nm?nm.title:"",
    completedMilestones:ms.filter(m=>m.done).map(m=>m.title),
    weeksIn:first?Math.max(1,Math.ceil((T0-toDate(first))/DAY/7)):0};
}

/* Daily brief for the Home page */
function brief(db){
  const out = [];
  const od = db.tasks.filter(isOverdue);
  if(od.length){ const p0=projById(db,od[0].projectId); out.push({tone:"bad",text:`<b>${od.length} overdue task${od.length>1?"s":""}</b>, including "${esc(od[0].task)}"${p0?" on "+esc(p0.name):""}.`,go:["project",od[0].projectId,"tasks"],cta:"View tasks"}); }
  openProjects(db).forEach(p=>{ const sp=spentRehab(db,p.id); if(p.rehabBudget>0 && sp>p.rehabBudget) out.push({tone:"bad",text:`<b>${esc(p.name)}</b> is ${money(sp-p.rehabBudget)} over its rehab budget.`,go:["project",p.id,"dashboard"],cta:"See budget"}); });
  const newDeals = (db.deals||[]).filter(d=>d.status==="New"), pursue = newDeals.filter(d=>d.recommendation==="Pursue");
  if(newDeals.length) out.push({tone:"gold",text:`<b>${newDeals.length} new deal${newDeals.length>1?"s":""}</b> from the Deal Checker${pursue.length?", "+pursue.length+" marked Pursue":""}.`,go:["deals"],cta:"Review deals"});
  const nr = needsReply(db);
  if(nr.length) out.push({tone:"gold",text:`<b>${nr.length} seller lead${nr.length>1?"s":""}</b> waiting on a reply. Replies are drafted for you to approve.`,go:["leads"],cta:"Review"});
  const todayEv = (db.events||[]).filter(x=>iso(new Date(x.start))===iso(T0) && new Date(x.end)>new Date()).sort((a,b)=>a.start.localeCompare(b.start));
  if(todayEv.length) out.push({tone:"ok",text:`<b>${todayEv.length} appointment${todayEv.length>1?"s":""} today</b>, next is ${esc(todayEv[0].title)} at ${fmtT(new Date(todayEv[0].start))}.`,go:["calendar"],cta:"Calendar"});
  const pq = db.quotes.filter(q=>q.status==="Pending");
  if(pq.length){ const it=pq[0]; const p1=projById(db,it.projectId); out.push({tone:"gold",text:`<b>${pq.length} quote${pq.length>1?"s":""}</b> waiting on a decision, starting with ${esc(String(it.item).toLowerCase())}${p1?" for "+esc(p1.name):""}.`,go:["project",it.projectId,"quotes"],cta:"Compare"}); }
  const drafts = db.posts.filter(p=>p.status==="Draft");
  if(drafts.length) out.push({tone:"gold",text:`<b>${drafts.length} social post${drafts.length>1?"s":""}</b> waiting for your approval.`,go:["social"],cta:"Open"});
  else { const sch = db.posts.filter(p=>p.status==="Scheduled").sort((a,b)=>a.date.localeCompare(b.date))[0]; if(sch) out.push({tone:"ok",text:`Next social post goes out <b>${whenLabel(sch.date)}</b> on ${esc(sch.platform)}.`,go:["social"],cta:"Open"}); }
  return out.slice(0,6);
}

/* ═══════════════════════ Apply a confirmed Ask Foreman change through the NPV app ═══════════════════════ */
const genId8 = () => Math.random().toString(36).slice(2,10);
const splitId = s => { const i=String(s||"").indexOf("|"); return i<0 ? [null,String(s||"")] : [String(s).slice(0,i),String(s).slice(i+1)]; };
async function applyNpvAction(ctx,a){
  const n = ctx.npv, db = ctx.db;
  switch(a.type){
    case "addExpense": {
      const P = projById(db,a.projectId); if(!P) throw new Error("Project not found.");
      const exp = {id:genId8(),description:(a.description||a.notes||a.category||"Expense").slice(0,200),amount:Number(a.amount),date:validDate(a.date)?a.date:dOff(0),
        category:oneOf(a.category,CONFIG.expenseCategories,"Other"),vendor:a.vendor||"",notes:a.notes||"Added by Foreman AI"};
      if(!(exp.amount>0)) throw new Error("The amount is missing.");
      await rawApi("addExpense",{projectId:P.id,expense:exp});
      break;
    }
    case "addTask": {
      const P = projById(db,a.projectId); if(!P) throw new Error("Project not found.");
      const [mpid,mid] = splitId(a.milestoneId);
      const task = {id:genId8(),task:String(a.task||"").slice(0,300),status:"To Do",assignee:oneOf(a.assignee,CONFIG.assignees,CONFIG.assignees[0]||"Me"),
        dueDate:validDate(a.due)?a.due:"",notes:"Added by Foreman AI",category:oneOf(a.category,CONFIG.taskCategories,"Other"),priority:PRI_IN[a.priority]||"Med",milestone:mpid===P.id?mid:""};
      if(!task.task) throw new Error("The task text is missing.");
      await rawApi("addTask",{projectId:P.id,task});
      break;
    }
    case "updateTask": {
      const T = db.tasks.find(t=>t.id===a.taskId); if(!T) throw new Error("That task isn't there anymore.");
      const upd = {...T.raw};                                         // start from the full saved task, so no column is blanked
      if(CONFIG.taskStatuses.indexOf(a.status)>-1) upd.status = a.status;
      if(validDate(a.due)) upd.dueDate = a.due;
      if(a.assignee) upd.assignee = a.assignee;
      if(PRI_IN[a.priority]) upd.priority = PRI_IN[a.priority];
      await rawApi("updateTask",{projectId:T.projectId,task:upd});
      break;
    }
    case "addMilestone": {
      if(!n.milestonesReady) throw new Error("Milestones haven't loaded yet. Reload the app and try again.");
      const P = projById(db,a.projectId); if(!P) throw new Error("Project not found.");
      n.setAllMilestones(prev=>({...prev,[P.id]:(prev[P.id]||[]).concat([{id:"ms-"+Date.now(),date:a.date,week:String(a.title).slice(0,120),items:[]}]).sort((x,y)=>new Date(x.date)-new Date(y.date))}));
      break;
    }
    case "updateMilestone": {
      if(!n.milestonesReady) throw new Error("Milestones haven't loaded yet. Reload the app and try again.");
      const [pid,mid] = splitId(a.milestoneId);
      if(!pid || !((n.allMilestones||{})[pid]||[]).some(m=>m.id===mid)) throw new Error("That milestone isn't there anymore.");
      if(a.title || validDate(a.date)) n.setAllMilestones(prev=>({...prev,[pid]:(prev[pid]||[]).map(m=>m.id!==mid?m:{...m,...(a.title?{week:String(a.title).slice(0,120)}:{}),...(validDate(a.date)?{date:a.date}:{})}).sort((x,y)=>new Date(x.date)-new Date(y.date))}));
      if(typeof a.done==="boolean") n.setAllMsStatus(prev=>({...prev,[pid]:{...(prev[pid]||{}),[mid]:a.done?"done":""}}));
      break;
    }
    case "addVendor": {
      if(!n.vendorsReady) throw new Error("Vendors haven't loaded yet. Reload the app and try again.");
      const cat = oneOf(a.category,CONFIG.vendorCategories,"Other");
      n.setVendors(prev=>({...prev,[cat]:(prev[cat]||[]).concat([{id:"v-"+Date.now(),name:String(a.name).slice(0,120),phone:a.phone||"",email:a.email||"",notes:a.notes||""}])}));
      break;
    }
    case "updateVendor": {
      if(!n.vendorsReady) throw new Error("Vendors haven't loaded yet. Reload the app and try again.");
      const V = db.vendors.find(v=>v.id===a.vendorId); if(!V) throw new Error("That vendor isn't there anymore.");
      const ch = ["phone","email","notes"].reduce((o,k)=>(a[k]?{...o,[k]:a[k]}:o),{});
      n.setVendors(prev=>({...prev,[V.category]:(prev[V.category]||[]).map(v=>v.id===V.id?{...v,...ch}:v)}));
      break;
    }
    default: throw new Error("Unsupported change: "+a.type);
  }
}

/* ═══════════════════════ Hook used by the NPV App: all Foreman state lives here ═══════════════════════ */
function useForeman(o){
  // o: {authed, npv:{...app state and setters...}, go(view,id,tab), notify(msg,type)}
  const n = o.npv;
  CONFIG.expenseCategories = n.lists.expenseCategories; CONFIG.taskCategories = n.lists.taskCategories;
  CONFIG.taskPriorities = n.lists.taskPriorities; CONFIG.taskStatuses = n.lists.taskStatuses;
  CONFIG.vendorCategories = n.lists.vendorCategories; CONFIG.assignees = n.lists.assignees;

  const [fdb,setFdb] = useState({leads:[],posts:[],events:[],autopilot:false,autoSocial:defaultAutoSocial(),social:{},loaded:false,error:"",calError:""});
  const [pAll,setPAll] = useState({expenses:{},tasks:{},quotes:{},at:0});
  const known = useRef(null);
  const notify = msg => o.notify(msg, /fail|error|couldn|can't|isn't|not set|refused/i.test(String(msg)) ? "error" : "success");

  const applyLive = r => {
    const ids = new Set((r.leads||[]).map(l=>l.id));
    if(known.current){ const fresh=(r.leads||[]).filter(l=>!known.current.has(l.id)); if(fresh.length) notify("New seller lead from "+fresh[0].name+(fresh.length>1?" and "+(fresh.length-1)+" more":"")); }
    known.current = ids;
    setFdb(d=>({...d,leads:r.leads||[],posts:r.posts||[],autopilot:!!r.autopilot,autoSocial:{...defaultAutoSocial(),...(r.autoSocial||{})},social:r.social||{},loaded:true,error:""}));
  };
  const refresh = () => api("getLive").then(applyLive);

  useEffect(()=>{
    if(!o.authed) return;
    refresh().catch(err=>setFdb(d=>({...d,error:err.message})));
    const t = setInterval(()=>{ if(!document.hidden) refresh().catch(()=>{}); },60000);
    return ()=>clearInterval(t);
  },[o.authed]);

  /* Calendar */
  const loadEvents = (from,to) => api("listEvents",{from:from.toISOString(),to:to.toISOString()})
    .then(r=>setFdb(d=>{ const keep=(d.events||[]).filter(x=>!(new Date(x.start)>=from && new Date(x.start)<to) && !r.events.some(m=>m.id===x.id)); return {...d,calError:"",events:keep.concat(r.events)}; }))
    .catch(err=>setFdb(d=>({...d,calError:err.message})));
  useEffect(()=>{
    if(!o.authed) return;
    const pull = () => { if(!document.hidden) loadEvents(new Date(T0.getTime()-7*DAY), new Date(T0.getTime()+45*DAY)); };
    pull(); const t = setInterval(pull,180000);
    return ()=>clearInterval(t);
  },[o.authed]);
  const up = (key,fn) => { if(["leads","posts","events"].indexOf(key)===-1) return; setFdb(d=>({...d,[key]:fn(d[key]||[])})); };
  const setDb = fn => setFdb(d=>{ const r = fn(d); return {...d,leads:r.leads,posts:r.posts,events:r.events,autopilot:r.autopilot,autoSocial:r.autoSocial}; });
  const calOps = {
    create: (ev,send) => api("createEvent",{event:ev,notify:send}).then(r=>{ up("events",es=>es.concat([r.event])); return r.event; }),
    update: (id,ch,send) => api("updateEvent",{id,changes:ch,notify:send}).then(r=>{ up("events",es=>es.map(x=>x.id===id?r.event:x)); return r.event; }),
    remove: (id,send) => api("deleteEvent",{id,notify:send}).then(()=>up("events",es=>es.filter(x=>x.id!==id))),
  };

  /* Read every project's expenses, tasks and quotes (read-only), so the brief and Ask Foreman see the whole business */
  const projKey = (n.projects||[]).map(p=>p.id).join(",");
  const loadAll = () => Promise.all((n.projects||[]).map(p=>
      Promise.all([rawApi("getExpenses",{projectId:p.id}),rawApi("getTasks",{projectId:p.id}),rawApi("getQuotes",{projectId:p.id})])
        .then(([x,t,q])=>[String(p.id),x.expenses||[],t.tasks||[],q.quotes||[]]).catch(()=>[String(p.id),null,null,null])))
    .then(list=>setPAll(prev=>{ const m={expenses:{...prev.expenses},tasks:{...prev.tasks},quotes:{...prev.quotes},at:Date.now()};
      list.forEach(([id,x,t,q])=>{ if(x) m.expenses[id]=x; if(t) m.tasks[id]=t; if(q) m.quotes[id]=q; }); return m; }));
  useEffect(()=>{
    if(!o.authed || !projKey) return;
    loadAll();
    const t = setInterval(()=>{ if(!document.hidden) loadAll(); },300000);
    return ()=>clearInterval(t);
  },[o.authed, projKey]);

  const db = buildDb(n, pAll, fdb);

  /* Keep the server's copy of project info current, so automated posts know about the flips */
  const sumKey = JSON.stringify(db.projects.filter(p=>p.status!=="General").map(p=>projSummary(db,p)));
  useEffect(()=>{
    if(!o.authed || !fdb.loaded || !projKey) return;
    const t = setTimeout(()=>{ api("syncProjects",{projects:JSON.parse(sumKey)}).catch(()=>{}); },4000);

    const raw=window.atob(base64);
    const arr=new Uint8Array(raw.length);

          "⚠️ Couldn't load "+loadWarn.join(", ")+". To protect your data, changes there won't be saved until you reload the app."),

    ...LoanModals(),

      e("div",{style:{...S.card,maxWidth:360,width:"100%"}},
        e("div",{style:{fontWeight:700,fontSize:16,marginBottom:8,color:"#f8f0d8"}},"Delete "+(delConfirm.type==="project"?"Project":delConfirm.type==="task"?"Task":delConfirm.type==="quote"?"Quote":"Expense")+"?"),
        e("p",{style:{fontSize:13,color:"#4a6fa5",marginBottom:20}},'"'+delConfirm.name+'" will be permanently removed'+(delConfirm.type==="project"?" and all its expenses":"")+"."),

  );
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e.message};}
  render(){
    if(this.state.error) return React.createElement("div",{style:{padding:32,color:"#ef4444",fontFamily:"monospace",fontSize:13,background:"#0a1628",minHeight:"100vh"}},
      React.createElement("div",{style:{fontWeight:700,fontSize:18,marginBottom:12}},"⚠️ App Error"),
      React.createElement("pre",{style:{whiteSpace:"pre-wrap",wordBreak:"break-all"}},this.state.error)
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(App)));
