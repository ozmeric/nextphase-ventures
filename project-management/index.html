function getRecColor(lead) {
  var rec = lead.recommendation || "Pass";
  var pf  = lead.projectedProfit;
  if (pf != null && pf < 0) return "#ef4444"; // negative profit = always red
  if (rec === "Pursue")    return "#10b981";
  if (rec === "Negotiate") return "#f59e0b";
  return "#ef4444"; // Pass = red always
}

async function api(action, extra={}, retries=2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(API_URL, {
        method:"POST",
        body: JSON.stringify({pin:SESSION_PIN, action, ...extra})
      });
      const text = await res.text();
      try {
        const data = JSON.parse(text);
        if (data.error) throw new Error(data.error);
        return data;
      } catch(parseErr) {
        if (attempt < retries) {
          await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
          continue;
        }
        throw new Error("Server error — please retry");
      }
    } catch(err) {
      if (attempt < retries) {
        await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
        continue;
      }
      throw err;
    }
  }
}

// ── PIN SCREEN ───────────────────────────────────────────────────────────
function PinScreen({onUnlock}) {
  const [pin,setPin]=useState("");
  const [err,setErr]=useState(false);
  const [checking,setChecking]=useState(false);
  const check=async()=>{
    if(!pin)return;
    setChecking(true);
    try{
      const res=await fetch(API_URL,{method:"POST",body:JSON.stringify({pin,action:"getProjects"})});
      const data=await res.json();
      if(data.error==="Unauthorized"){setErr(true);setPin("");}
      else onUnlock(pin);
    }catch(e){setErr(true);}
    setChecking(false);
  };
  return React.createElement("div",{style:{minHeight:"100vh",background:"#0a1628",display:"flex",alignItems:"center",justifyContent:"center",padding:16}},
    React.createElement("div",{style:{background:"#0d1f3c",border:"1px solid #1e3a5f",borderRadius:16,padding:"40px 36px",textAlign:"center",width:"100%",maxWidth:340}},
      React.createElement("div",{style:{marginBottom:24,display:"flex",flexDirection:"column",alignItems:"center",gap:8}},
        React.createElement("div",{style:{fontSize:36,marginBottom:4}},"🏗️"),
        React.createElement("div",{style:{fontWeight:800,fontSize:20,color:"#f8f0d8",letterSpacing:"-0.5px"}},"NextPhase Ventures")
      ),
      React.createElement("div",{style:{fontSize:13,color:"#4a6fa5",marginBottom:28,textAlign:"center"}},"Enter PIN to continue"),
      React.createElement("input",{type:"password",maxLength:6,placeholder:"••••",value:pin,autoFocus:true,
        style:{...S.input,fontSize:28,textAlign:"center",letterSpacing:10,padding:14,marginBottom:err?8:16,border:err?"1px solid #ef4444":"1px solid #1e3a5f"},
        onChange:ev=>{setPin(ev.target.value);setErr(false);},
        onKeyDown:ev=>ev.key==="Enter"&&check()
      }),
      err&&React.createElement("div",{style:{fontSize:12,color:"#ef4444",marginBottom:12}},"Incorrect PIN."),
      React.createElement("button",{style:{...S.btn(),width:"100%",padding:13,fontSize:15},onClick:check,disabled:checking},checking?"Checking…":"Unlock"),
      React.createElement("div",{style:{fontSize:10,color:"#2a4a7f",marginTop:20,letterSpacing:"0.04em"}},"Powered by BuildFlow — Weblina LLC")
    )
  );
}

// ── APP ──────────────────────────────────────────────────────────────────
function App() {
  const [authed,setAuthed]         = useState(()=>{try{return sessionStorage.getItem("npv-auth")==="ok"}catch{return false}});
  const [projects,setProjects]     = useState([]);
  const [activeId,setActiveId]     = useState(null);
  const [reloadTick,setReloadTick] = useState(0);
  const [expenses,setExpenses]     = useState([]);
  const [loading,setLoading]       = useState(true);
  const [loadingExp,setLoadingExp] = useState(false);
  const [saving,setSaving]         = useState(false);
  const [view,setView]             = useState("home");
  const [form,setForm]             = useState({});
  const [filter,setFilter]         = useState({category:"",search:""});
  const [toast,setToast]           = useState(null);
  const [delConfirm,setDelConfirm] = useState(null);
  const [error,setError]           = useState(null);
  const [tasks,setTasks]           = useState([]);
  const [loadingTasks,setLoadingTasks] = useState(false);
  const [taskFilter,setTaskFilter] = useState("");
  const [taskWorkFilter,setTaskWorkFilter] = useState("");
  const [quotes,setQuotes]         = useState([]);
  // ── PLANNING STATE — keyed by projectId ──
  const [allMilestones,setAllMilestones] = useState({
    "lincoln-2701": [
      {id:"ms-1",date:"2026-08-14",week:"Demo & Remediation",items:[{type:"Interior",text:"Mold remediation completed"},{type:"Exterior",text:"Landscaping first phase, Driveway"}]},
      {id:"ms-2",date:"2026-08-21",week:"Rough-In",items:[{type:"Interior",text:"Electric, Plumbing, HVAC completed"}]},
      {id:"ms-3",date:"2026-08-28",week:"Drywall & Exterior",items:[{type:"Interior",text:"Drywall, Flooring completed"},{type:"Exterior",text:"Carpentry and paint completed"}]},
      {id:"ms-4",date:"2026-09-04",week:"Finishes",items:[{type:"Interior",text:"Cabinets, tiles, bathtubs etc completed"}]},
      {id:"ms-5",date:"2026-09-11",week:"Final & Staging",items:[{type:"Interior",text:"Staging completed"},{type:"Exterior",text:"Landscaping second phase"}]}
    ]
  }); // Will be overwritten by Sheet data on load
  // ── MANAGEMENT CARD STATE ──
  const [mgmtMilestones,setMgmtMilestones] = useState([]);
  const [mgmtTasks,setMgmtTasks] = useState([]);
  const [showMgmt,setShowMgmt] = useState(false);
  const [mgmtSelMs,setMgmtSelMs] = useState(null);
  const [mgmtMsStatus,setMgmtMsStatus] = useState({});
  const [mgmtMsComments,setMgmtMsComments] = useState({});
  const [mgmtCommentInput,setMgmtCommentInput] = useState({});
  const [showAddMgmtMs,setShowAddMgmtMs] = useState(false);
  const [mgmtMsForm,setMgmtMsForm] = useState({date:"",week:"",notes:""});
  const [editMgmtMs,setEditMgmtMs] = useState(null);
  const [showAddMgmtTask,setShowAddMgmtTask] = useState(false);
  const [mgmtTaskForm,setMgmtTaskForm] = useState({task:"",status:"To Do",notes:""});

  // ── VENDORS STATE ──
  const DEFAULT_VENDOR_CATEGORIES = [
    "Dumpster Companies","Landscapers","Electricians","HVAC","Plumbing",
    "Carpenters","Interior Paint","Exterior Paint","Loan Providers",
    "Title Companies","Real Estate Agents","Inspectors","General Contractors","Other"
  ];
  const [vendorCategories,setVendorCategories] = useState(DEFAULT_VENDOR_CATEGORIES);
  const VENDOR_CATEGORIES = vendorCategories;
  const [vendors,setVendors] = useState({});
  const [vendorCat,setVendorCat] = useState("All");
  const [showNewVendorCat,setShowNewVendorCat] = useState(false);
  const [vendorsLoaded,setVendorsLoaded] = useState(false);
  const [milestonesLoaded,setMilestonesLoaded] = useState(false);
  const [mgmtLoaded,setMgmtLoaded] = useState(false);
  const [showAddVendor,setShowAddVendor] = useState(false);
  const [editVendorId,setEditVendorId] = useState(null);

  const [planView,setPlanView] = useState("weekly");
  const [allSelMs,setAllSelMs] = useState({});
  const [showAddMs,setShowAddMs] = useState(false);
  const [msForm,setMsForm] = useState({date:"",week:"",interior:"",exterior:""});
  const [allMsStatus,setAllMsStatus] = useState({});
  const [allMsComments,setAllMsComments] = useState({});
  const [editMs,setEditMs] = useState(null);
  const [editMsForm,setEditMsForm] = useState({date:"",week:"",interior:"",exterior:""});
  const [allCommentInput,setAllCommentInput] = useState({});
  const [loadingQuotes,setLoadingQuotes] = useState(false);
  const [quoteGroupFilter,setQuoteGroupFilter] = useState("");
  const [leads,setLeads]               = useState([]);
  const [loadingLeads,setLoadingLeads] = useState(false);
  const [leadFilter,setLeadFilter]     = useState("All");
  const [leadStatus,setLeadStatus]     = useState("All");
  const [expandedLead,setExpandedLead] = useState(null);

  // Derived — per-project planning state
  const milestones = allMilestones[activeId]||[];
  const setMilestones = (updater) => setAllMilestones(prev=>({...prev,[activeId]:typeof updater==="function"?updater(prev[activeId]||[]):updater}));
  const selMs = allSelMs[activeId]||null;
  const setSelMs = (v) => setAllSelMs(prev=>({...prev,[activeId]:typeof v==="function"?v(prev[activeId]):v}));
  const msStatus = allMsStatus[activeId]||{};
  const setMsStatus = (updater) => setAllMsStatus(prev=>({...prev,[activeId]:typeof updater==="function"?updater(prev[activeId]||{}):updater}));
  const msComments = allMsComments[activeId]||{};
  const setMsComments = (updater) => setAllMsComments(prev=>({...prev,[activeId]:typeof updater==="function"?updater(prev[activeId]||{}):updater}));
  const commentInput = allCommentInput[activeId]||{};
  const setCommentInput = (updater) => setAllCommentInput(prev=>({...prev,[activeId]:typeof updater==="function"?updater(prev[activeId]||{}):updater}));

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};


  const updateLeadStatus=async(lead,newStatus)=>{
    const updated={...lead,status:newStatus};
    setLeads(prev=>prev.map(l=>l.id===lead.id?updated:l));
    try{await api("updateLead",{lead:updated});showToast("Lead updated.");}
    catch(err){showToast("Update failed","error");}
  };

  const updateLeadNotes=async(lead,notes)=>{
    const updated={...lead,notes};
    setLeads(prev=>prev.map(l=>l.id===lead.id?updated:l));
    try{await api("updateLead",{lead:updated});}catch(err){}
  };

  const deleteLead=async(leadId)=>{
    setSaving(true);
    try{
      await api("deleteLead",{leadId});
      setLeads(prev=>prev.filter(l=>l.id!==leadId));
      showToast("Lead deleted.");
    }catch(err){showToast("Delete failed","error");}
    setDelConfirm(null);setSaving(false);
  };

  const refreshLeads=async(silent=false)=>{
    // Don't auto-refresh if a lead is expanded — user may be editing numbers
    if(silent && expandedLead) return;
    setLoadingLeads(true);
    try{
      const prev=leads.length;
      const data=await api("getLeads");
      const fresh=data.leads||[];
      const newCount=fresh.filter(l=>l.status==="New").length;
      // Preserve local edits — if a lead has _edited flag keep local version
      setLeads(prev2=>fresh.map(fl=>{
        const local=prev2.find(l=>l.id===fl.id);
        if(local&&local._edited) return local;
        return fl;
      }));
      if(!silent) showToast("Leads refreshed — "+fresh.length+" total.");
      if(fresh.length>prev&&"Notification" in window&&Notification.permission==="granted"){
        const added=fresh.length-prev;
        new Notification("📬 NPV Deal Alert",{
          body:added+" new deal"+(added>1?"s":"")+" arrived — "+newCount+" unreviewed",
          icon:"./icon-192.png",badge:"./icon-192.png",tag:"npv-lead"
        });
      }
    }
    catch(err){if(!silent)showToast("Refresh failed","error");}
    setLoadingLeads(false);
  };

  const requestNotificationPermission=async()=>{
    if(!("Notification" in window)){showToast("Notifications not supported","error");return;}
    if(!("serviceWorker" in navigator)||!("PushManager" in window)){showToast("Push not supported","error");return;}
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){showToast("Permission denied.","error");return;}
    try{
      const keyRes=await fetch(PUSH_SERVER_URL+"/vapid-public-key");
      const {publicKey}=await keyRes.json();
      const reg=await navigator.serviceWorker.ready;
      const subscription=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(publicKey)
      });
      let deviceId=localStorage.getItem("npv-device-id");
      if(!deviceId){deviceId="dev-"+Math.random().toString(36).slice(2,10)+"-"+Date.now();localStorage.setItem("npv-device-id",deviceId);}
      const res=await fetch(PUSH_SERVER_URL+"/subscribe",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({subscription,deviceId})
      });
      if(res.ok){showToast("🔔 Push notifications enabled!");localStorage.setItem("npv-push-enabled","true");}
      else showToast("Failed to register push.","error");
    }catch(err){showToast("Push error: "+err.message,"error");}
  };

  function urlBase64ToUint8Array(base64String){
    const padding="=".repeat((4-(base64String.length%4))%4);
    const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
    const raw=window.atob(base64);
    const arr=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
    return arr;
  }

  // Auto-poll leads every 2 minutes when app is open
  useEffect(()=>{
    if(!authed) return;
    const interval = setInterval(()=>{ refreshLeads(true); }, 2 * 60 * 1000);
    return ()=>clearInterval(interval);
  },[authed]);

  const unlock=(pin)=>{SESSION_PIN=pin;try{sessionStorage.setItem("npv-auth","ok");sessionStorage.setItem("npv-pin",pin);}catch{}setAuthed(true);};

  useEffect(()=>{
    if(authed){try{const p=sessionStorage.getItem("npv-pin");if(p)SESSION_PIN=p;}catch{}}

    if(!authed)return;

  const LeadCalculator=({lead,updateLeadStatus,updateLeadNotes,setDelConfirm,setMgmtMilestones,navTo,showToast,api,setLeads})=>{
    const full = lead._full || {};
    const rb   = full.rehabBreakdown || {};
    const pf   = full.proForma || {};

    // Editable state — pre-fill from full analysis or lead columns
    const [askPrice,    setAskPrice]    = useState(lead.askPrice    || "");
    const [arv,         setArv]         = useState(lead.arvEstimate || "");
    const [beds,        setBeds]        = useState(lead.beds        || "");
    const [baths,       setBaths]       = useState(lead.baths       || "");
    const [sqft,        setSqft]        = useState(lead.sqft        || "");
    const [holdMonths,  setHoldMonths]  = useState(lead.holdingPeriodMonths || 4.5);
    const [targetProfit,setTargetProfit]= useState(100000);
    const [notes2,      setNotes2]      = useState(lead.notes || "");

    // Editable rehab line items
    const [rehab, setRehab] = useState({
      demo:        rb.demo        || 0,
      roof:        rb.roof        || 0,
      hvac:        rb.hvac        || 0,
      electrical:  rb.electrical  || 0,
      plumbing:    rb.plumbing    || 0,
      drywall:     rb.drywall     || 0,
      flooring:    rb.flooring    || 0,
      kitchen:     rb.kitchen     || 0,
      bathrooms:   rb.bathrooms   || 0,
      paint:       rb.paint       || 0,
      exterior:    rb.exterior    || 0,
      landscape:   rb.landscape   || rb.other || 0,
      other:       0,
    });

    // Calculated results
    const [calc, setCalc] = useState(null);
    const [saving2, setSaving2] = useState(false);

    const fmt$ = n => n!=null ? "$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0}) : "—";
    const fmtPct = n => n!=null ? (n*100).toFixed(1)+"%" : "—";

    const rehabSubtotal = Object.values(rehab).reduce((a,b)=>a+(parseFloat(b)||0),0);
    const contingency   = Math.round(rehabSubtotal * 0.12);
    const rehabTotal    = rehabSubtotal + contingency;

    const calculate = () => {
      const p   = parseFloat(askPrice) || 0;
      const a   = parseFloat(arv)      || 0;
      const h   = parseFloat(holdMonths)|| 4.5;
      const tp  = parseFloat(targetProfit)||100000;
      const loan = p * 0.80 + rehabTotal;
      const closing  = p * 0.04;
      const interest = loan * 0.10 / 12 * h;
      const points   = loan * 0.02;
      const selling  = a * 0.06;
      const totalCost= p + closing + rehabTotal + interest + points;
      const netProc  = a - selling;
      const profit   = netProc - totalCost;
      const margin   = a > 0 ? profit / a : null;
      const roi      = (p*0.20 + rehabTotal) > 0 ? profit / (p*0.20 + rehabTotal) : null;
      const maoNew   = a * 0.88 - rehabTotal - tp;
      const suggested= maoNew;
      const rec      = profit < 0 ? "Pass" : p <= suggested ? "Pursue" : p <= suggested*1.15 ? "Negotiate" : "Pass";
      setCalc({p,a,loan,closing,interest,points,selling,totalCost,netProc,profit,margin,roi,maoNew,suggested,rec,tp,h});
    };

    const saveRevised = async () => {
      if (!calc) { showToast("Run Recalculate first","error"); return; }
      setSaving2(true);
      try {
        const updated = {
          ...lead,
          _edited: true,
          askPrice:           parseFloat(askPrice)||lead.askPrice,
          arvEstimate:        parseFloat(arv)||lead.arvEstimate,
          rehabEstimate:      rehabTotal,
          suggestedOffer:     calc.suggested,
          maoNew:             calc.maoNew,
          mao:                calc.maoNew,
          projectedProfit:    calc.profit,
          profitMarginPct:    calc.margin,
          recommendation:     calc.rec,
          holdingPeriodMonths:parseFloat(holdMonths)||lead.holdingPeriodMonths,
          notes: notes2,
        };
        await api("updateLead",{lead:updated});
        // Update parent leads array — preserves component state since key stays same
        setLeads(prev=>prev.map(l=>l.id===lead.id?{...updated,_full:l._full}:l));
        showToast("✅ Saved — "+calc.rec+" at "+fmt$(calc.suggested));
      } catch(err) { showToast("Save failed: "+err.message,"error"); }
      setSaving2(false);
    };

    // Auto-save notes on blur
    const saveNotes = async (val) => {
      try {
        await api("updateLead",{lead:{...lead,notes:val}});
      } catch(err) {}
    };

    const inputStyle = {background:"#071020",border:"1px solid #1e3a5f",borderRadius:6,padding:"7px 10px",color:"#e2e8f0",fontSize:13,width:"100%",outline:"none",MozAppearance:"textfield",WebkitAppearance:"none"};
    const labelStyle = {fontSize:10,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4,display:"block"};
    const statBox = (label,val,color="#f8f0d8") => e("div",{style:{background:"#071020",borderRadius:8,padding:"10px 12px"}},
      e("div",{style:{fontSize:10,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:3}},label),
      e("div",{style:{fontSize:13,fontWeight:800,color}},val)
    );

    const recColor = calc ? (calc.rec==="Pursue"?"#10b981":calc.rec==="Negotiate"?"#f59e0b":"#ef4444") : getRecColor(lead);

    return e("div",null,

      // ── Summary stats ──
      e("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}},
        statBox("Ask Price",     fmt$(parseFloat(askPrice)||lead.askPrice)),
        statBox("Suggested Offer",calc?fmt$(calc.suggested):fmt$(lead.suggestedOffer),"#10b981"),
        statBox("ARV Estimate",  fmt$(parseFloat(arv)||lead.arvEstimate),"#d4a017"),
        statBox("Rehab Total",   fmt$(rehabTotal),"#a78bfa"),
        statBox("Projected Profit",calc?fmt$(calc.profit):fmt$(lead.projectedProfit),calc?(calc.profit<0?"#ef4444":"#10b981"):lead.projectedProfit<0?"#ef4444":"#10b981"),
        statBox("Profit Margin", calc?fmtPct(calc.margin):fmtPct(lead.profitMarginPct), calc?(calc.margin<0?"#ef4444":calc.margin>=0.12?"#10b981":"#f59e0b"):"#6b7280"),
        statBox("Beds / Baths",  (beds||lead.beds||"?")+" bd / "+(baths||lead.baths||"?")+" ba"),
        statBox("Sqft / Year",   (sqft||lead.sqft||"—")+" SF · "+(lead.yearBuilt||"—")),
        statBox("Hold Period",   (holdMonths||4.5)+" mos"),
        statBox("MAO (New Formula)",calc?fmt$(calc.maoNew):fmt$(lead.maoNew),"#d4a017"),
        statBox("Neighborhood",  lead.neighborhood||full.neighborhood||"—"),
      ),

      // ── Analysis Summary ──
      (lead.summary||full.summary)&&e("div",{style:{background:"#071020",borderRadius:8,padding:"12px 14px",marginBottom:12}},
        e("div",{style:{fontSize:11,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"📋 Analysis Summary"),
        e("div",{style:{fontSize:12,color:"#cbd5e1",lineHeight:1.6}},lead.summary||full.summary)
      ),

      // ── ARV Reasoning ──
      full.arvReasoning&&e("div",{style:{background:"#071020",borderRadius:8,padding:"12px 14px",marginBottom:12}},
        e("div",{style:{fontSize:11,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"🏡 ARV Reasoning"),
        e("div",{style:{fontSize:12,color:"#cbd5e1",lineHeight:1.6}},full.arvReasoning),
        full.conditionNotes&&e("div",{style:{fontSize:11,color:"#4a6fa5",marginTop:4}},"Condition: "+full.conditionNotes)
      ),

      // ── EDITABLE DEAL INPUTS ──
      e("div",{style:{background:"#071020",borderRadius:8,padding:"14px",marginBottom:12}},
        e("div",{style:{fontSize:11,fontWeight:700,color:"#d4a017",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}},"✏️ Edit Deal Inputs"),
        e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}},
          e("div",null,e("label",{style:labelStyle},"Ask Price ($)"),e("input",{style:inputStyle,type:"text",inputMode:"numeric",value:askPrice,onChange:ev=>setAskPrice(ev.target.value.replace(/[^0-9.]/g,"")),placeholder:"e.g. 450000"})),
          e("div",null,e("label",{style:labelStyle},"ARV Estimate ($)"),e("input",{style:inputStyle,type:"text",inputMode:"numeric",value:arv,onChange:ev=>setArv(ev.target.value.replace(/[^0-9.]/g,"")),placeholder:"e.g. 900000"})),
          e("div",null,e("label",{style:labelStyle},"Hold Period (months)"),e("input",{style:inputStyle,type:"text",inputMode:"decimal",value:holdMonths,onChange:ev=>setHoldMonths(ev.target.value.replace(/[^0-9.]/g,"")),placeholder:"4.5"})),
          e("div",null,e("label",{style:labelStyle},"Target Profit ($)"),e("input",{style:inputStyle,type:"text",inputMode:"numeric",value:targetProfit,onChange:ev=>setTargetProfit(ev.target.value.replace(/[^0-9.]/g,"")),placeholder:"100000"})),
        )
      ),

      // ── EDITABLE REHAB BREAKDOWN ──
      e("div",{style:{background:"#071020",borderRadius:8,padding:"14px",marginBottom:12}},
        e("div",{style:{fontSize:11,fontWeight:700,color:"#a78bfa",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}},"🔨 Rehab Breakdown (Editable)"),
        e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          ...Object.entries(rehab).map(([k,v])=>
            e("div",{key:k},
              e("label",{style:labelStyle},k.charAt(0).toUpperCase()+k.slice(1)+" ($)"),
              e("input",{
                style:inputStyle,
                type:"text",
                inputMode:"numeric",
                value:v===0?"":v,
                placeholder:"0",
                onChange:ev=>{
                  var raw=ev.target.value.replace(/[^0-9.]/g,"");
                  setRehab(prev=>({...prev,[k]:raw===""?0:parseFloat(raw)||0}));
                }
              })
            )
          )
        ),
        e("div",{style:{marginTop:12,padding:"10px 12px",background:"#0a1628",borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center"}},
          e("div",null,
            e("div",{style:{fontSize:10,color:"#4a6fa5",marginBottom:2}},"SUBTOTAL"),
            e("div",{style:{fontWeight:800,color:"#f8f0d8"}},fmt$(rehabSubtotal))
          ),
          e("div",{style:{textAlign:"center"}},
            e("div",{style:{fontSize:10,color:"#4a6fa5",marginBottom:2}},"CONTINGENCY (12%)"),
            e("div",{style:{fontWeight:800,color:"#f59e0b"}},fmt$(contingency))
          ),
          e("div",{style:{textAlign:"right"}},
            e("div",{style:{fontSize:10,color:"#4a6fa5",marginBottom:2}},"TOTAL REHAB"),
            e("div",{style:{fontWeight:800,color:"#a78bfa",fontSize:16}},fmt$(rehabTotal))
          )
        )
      ),

      // ── CALCULATE BUTTON ──
      e("button",{
        style:{width:"100%",padding:"12px",borderRadius:8,border:"none",background:"#d4a017",color:"#0a1628",fontWeight:900,fontSize:14,cursor:"pointer",marginBottom:12},
        onClick:calculate
      },"⚡ Recalculate Deal"),

      // ── CALCULATED RESULTS ──
      calc&&e("div",{style:{background:"#071020",borderRadius:8,padding:"14px",marginBottom:12,border:"2px solid "+recColor}},
        e("div",{style:{fontSize:11,fontWeight:700,color:recColor,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}},"📊 Recalculated Pro Forma — "+calc.rec),
        e("div",{style:{fontSize:13,color:"#cbd5e1",lineHeight:2.2}},
          e("div",{style:{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #1e3a5f"}},e("span","Closing Costs (4%)"),e("span",fmt$(calc.closing))),
          e("div",{style:{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #1e3a5f"}},e("span","Holding Costs ("+calc.h+" mos @ 10% HML)"),e("span",fmt$(calc.interest))),
          e("div",{style:{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #1e3a5f"}},e("span","Financing Points (2%)"),e("span",fmt$(calc.points))),
          e("div",{style:{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #1e3a5f"}},e("span","Selling Costs (6%)"),e("span",fmt$(calc.selling))),
          e("div",{style:{display:"flex",justifyContent:"space-between",borderBottom:"2px solid #4a6fa5",fontWeight:700}},e("span","Total Project Cost"),e("span",fmt$(calc.totalCost))),
          e("div",{style:{display:"flex",justifyContent:"space-between",borderBottom:"1px solid #1e3a5f"}},e("span","Net Sale Proceeds"),e("span",fmt$(calc.netProc))),
          e("div",{style:{display:"flex",justifyContent:"space-between",fontWeight:900,fontSize:15,color:recColor}},e("span","Projected Profit"),e("span",fmt$(calc.profit))),
        ),
        e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:10}},
          e("div",{style:{textAlign:"center"}},
            e("div",{style:{fontSize:10,color:"#4a6fa5",marginBottom:2}},"MAO (New Formula)"),
            e("div",{style:{fontWeight:800,color:"#d4a017"}},fmt$(calc.maoNew))
          ),
          e("div",{style:{textAlign:"center"}},
            e("div",{style:{fontSize:10,color:"#4a6fa5",marginBottom:2}},"Suggested Offer"),
            e("div",{style:{fontWeight:800,color:"#10b981",fontSize:14}},fmt$(calc.suggested))
          ),
        )
      ),

      // ── Red Flags ──
      (lead.redFlags||full.redFlags)&&String(lead.redFlags||full.redFlags||"").length>0&&!String(lead.redFlags||"").includes("Not a deal")&&
        e("div",{style:{background:"#ef444411",border:"1px solid #ef444433",borderRadius:8,padding:"10px 14px",marginBottom:12}},
          e("div",{style:{fontSize:11,fontWeight:700,color:"#ef4444",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}},"⚠️ Red Flags"),
          e("div",{style:{fontSize:12,color:"#ef4444",lineHeight:1.8}},String(lead.redFlags||full.redFlags||""))
        ),

      // ── Data Gaps ──
      full.dataGaps&&full.dataGaps.length>0&&
        e("div",{style:{background:"#f59e0b11",border:"1px solid #f59e0b33",borderRadius:8,padding:"10px 14px",marginBottom:12}},
          e("div",{style:{fontSize:11,fontWeight:700,color:"#f59e0b",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.06em"}},"📋 Data Gaps & Assumptions"),
          e("div",{style:{fontSize:12,color:"#f59e0b",lineHeight:1.8}},Array.isArray(full.dataGaps)?full.dataGaps.join(", "):String(full.dataGaps))
        ),

      // ── Status ──
      e("div",{style:{marginBottom:12}},
        e("div",{style:{fontSize:11,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}},"Update Status"),
        e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
          LEAD_STATUSES.map(st=>e("button",{key:st,
            style:{padding:"6px 14px",borderRadius:99,fontSize:12,fontWeight:700,
              border:"1px solid "+(lead.status===st?LEAD_STATUS_COLORS[st]:"#1e3a5f"),
              background:lead.status===st?LEAD_STATUS_COLORS[st]+"33":"transparent",
              color:lead.status===st?LEAD_STATUS_COLORS[st]:"#7a9cc5",cursor:"pointer"},
            onClick:()=>updateLeadStatus(lead,st)},st))
        )
      ),

      // ── Notes ──
      e("div",{style:{marginBottom:12}},
        e("div",{style:{fontSize:11,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}},"Notes"),
        e("textarea",{style:{...S.input,minHeight:70,resize:"vertical",fontSize:12},placeholder:"Add notes, counter offer, next steps…",value:notes2,onChange:ev=>setNotes2(ev.target.value),onBlur:ev=>saveNotes(ev.target.value)})
      ),

      // ── Actions ──
      e("div",{style:{display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}},
        e("button",{style:{background:"#ef444415",border:"none",color:"#ef4444",cursor:"pointer",padding:"7px 14px",borderRadius:6,fontSize:12,fontWeight:600},
          onClick:()=>setDelConfirm({type:"lead",id:lead.id,name:lead.address||"this lead"})},"Delete"),
        e("button",{
          style:{...S.btn("ghost"),fontSize:12,padding:"7px 14px"},
          disabled:saving2,
          onClick:saveRevised
        },saving2?"Saving…":"💾 Save Numbers"),
        e("button",{style:{...S.btn(),fontSize:12,padding:"7px 14px"},
          onClick:()=>{
            setMgmtMilestones(prev=>[...prev,{id:"mgmt-"+Date.now(),date:"",
              week:lead.address||"New Deal",
              notes:"Ask: $"+(askPrice||lead.askPrice||"—")+" · Offer: $"+(calc?Math.round(calc.suggested).toLocaleString():lead.suggestedOffer||"—")+" · ARV: $"+(arv||lead.arvEstimate||"—")}]);
            updateLeadStatus(lead,"Pursuing");
            navTo("management");
            showToast("Added to pipeline!");
          }},"➕ Add to Pipeline")
      )
    );
  };

        e("div",{style:{background:"#0d1f3c",border:"1px solid #1e3a5f",borderRadius:10,padding:"14px 12px",textAlign:"center"}},
          e("div",{style:{fontSize:22,fontWeight:900,color:"#10b981"}},completed.length),
          e("div",{style:{fontSize:10,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginTop:4}},"Completed")
        ),
        e("div",{style:{background:"#0d1f3c",border:"1px solid #1e3a5f",borderRadius:10,padding:"14px 12px",textAlign:"center"}},
          e("div",{style:{fontSize:22,fontWeight:900,color:"#f59e0b"}},inProgress.length),
          e("div",{style:{fontSize:10,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginTop:4}},"In Progress")
        ),
        e("div",{style:{background:"#0d1f3c",border:"1px solid #1e3a5f",borderRadius:10,padding:"14px 12px",textAlign:"center"}},
          e("div",{style:{fontSize:22,fontWeight:900,color:"#a78bfa"}},mgmtMilestones.length),
          e("div",{style:{fontSize:10,fontWeight:700,color:"#4a6fa5",textTransform:"uppercase",letterSpacing:"0.06em",marginTop:4}},"Pipeline")
        )
      ),

      // In Progress Projects
      inProgress.length>0&&e("div",{style:{...S.card,marginBottom:16}},
        e("div",{style:{fontSize:12,fontWeight:700,color:"#f59e0b",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}},"🔨 In Progress"),
        inProgress.map(p=>e("div",{key:p.id,style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #1e3a5f",cursor:"pointer"},
          onClick:()=>{setActiveId(p.id);setExpenses([]);setTasks([]);setQuotes([]);setReloadTick(t=>t+1);navTo("dashboard");}},
          e("div",null,
            e("div",{style:{fontWeight:700,color:"#f8f0d8",fontSize:13}},p.name),
            e("div",{style:{fontSize:11,color:"#4a6fa5",marginTop:2}},p.description?.split("|")[0]?.trim()||"Fix & Flip")
          ),
          e("span",{style:{fontSize:12,color:"#d4a017",fontWeight:600}},"Open →")
        ))
      ),

      // Pipeline / Upcoming
      e("div",{style:{...S.card,marginBottom:16}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
          e("div",{style:{fontSize:12,fontWeight:700,color:"#a78bfa",textTransform:"uppercase",letterSpacing:"0.06em"}},"🏁 Pipeline & Upcoming"),
          e("button",{style:{...S.btn(),fontSize:11,padding:"5px 12px"},onClick:()=>setShowAddMgmtMs(true)},"+ Add")
        ),
        mgmtMilestones.length===0
          ?e("div",{style:{fontSize:12,color:"#2a4a7f",padding:"8px 0"}},"No pipeline items yet — add upcoming deals or goals")
          :mgmtMilestones.map(ms=>{
            const isSel=mgmtSelMs===ms.id;
            const st=mgmtMsStatus[ms.id]||"upcoming";
            const col=sCol2[st];
            const comments=mgmtMsComments[ms.id]||[];
            const cIn=mgmtCommentInput[ms.id]||"";
            return e("div",{key:ms.id,style:{background:"#071020",borderRadius:10,padding:"12px 14px",marginBottom:8,border:`1px solid ${isSel?col:"#1e3a5f"}`}},
              e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"},onClick:()=>setMgmtSelMs(isSel?null:ms.id)},
                e("div",null,
                  e("div",{style:{fontSize:14,fontWeight:700,color:"#f8f0d8"}},ms.week),
                  ms.date&&e("div",{style:{fontSize:11,color:"#4a6fa5",marginTop:2}},new Date(ms.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}))
                ),
                e("div",{style:{display:"flex",gap:6,alignItems:"center"}},
                  e("span",{style:{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:99,background:col+"22",color:col}},st==="in-progress"?"🔄 Active":st==="done"?"✅ Done":"📅 Planned"),
                  e("button",{style:{background:"#1e3a5f",border:"none",color:"#7a9cc5",cursor:"pointer",padding:"3px 8px",borderRadius:6,fontSize:11},
                    onClick:ev=>{ev.stopPropagation();setEditMgmtMs(ms.id);}
                  },"Edit")
                )
              ),
              ms.notes&&e("div",{style:{fontSize:12,color:"#7a9cc5",marginTop:6}},ms.notes),
              isSel&&e("div",null,
                e("div",{style:{display:"flex",gap:8,marginTop:10,paddingTop:10,borderTop:"1px solid #1e3a5f"}},
                  e("span",{style:{fontSize:11,color:"#4a6fa5",alignSelf:"center"}},"Status:"),
                  ["in-progress","done"].map(s=>e("button",{key:s,style:{padding:"3px 10px",borderRadius:99,fontSize:11,fontWeight:700,border:`1px solid ${sCol2[s]}`,background:mgmtMsStatus[ms.id]===s?sCol2[s]+"33":"transparent",color:sCol2[s],cursor:"pointer"},
                    onClick:ev=>{ev.stopPropagation();setMgmtMsStatus(p=>({...p,[ms.id]:p[ms.id]===s?"upcoming":s}));}},
                    s==="in-progress"?"🔄 Active":"✅ Done"
                  ))
                ),
                e("div",{style:{marginTop:10,paddingTop:10,borderTop:"1px solid #1e3a5f"}},
                  e("div",{style:{fontSize:11,fontWeight:700,color:"#4a6fa5",marginBottom:6}},"💬 Notes & Comments"),
                  comments.map((c,ci)=>e("div",{key:ci,style:{fontSize:12,color:"#7a9cc5",padding:"4px 0",borderBottom:"1px solid #071020"}},c.text+" · "+c.ts)),
                  e("div",{style:{display:"flex",gap:6,marginTop:6}},
                    e("input",{style:{...S.input,flex:1,padding:"6px 10px",fontSize:12},placeholder:"Add note…",value:cIn,
                      onChange:ev=>setMgmtCommentInput(p=>({...p,[ms.id]:ev.target.value})),
                      onKeyDown:ev=>{if(ev.key==="Enter"&&cIn.trim()){
                        const ts=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
                        setMgmtMsComments(p=>({...p,[ms.id]:[...(p[ms.id]||[]),{text:cIn.trim(),ts}]}));
                        setMgmtCommentInput(p=>({...p,[ms.id]:""}));
                      }}
                    }),
                    e("button",{style:{...S.btn(),padding:"6px 12px",fontSize:12},onClick:()=>{
                      const cIn2=mgmtCommentInput[ms.id]||"";
                      if(!cIn2.trim())return;
                      const ts=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"});
                      setMgmtMsComments(p=>({...p,[ms.id]:[...(p[ms.id]||[]),{text:cIn2.trim(),ts}]}));
                      setMgmtCommentInput(p=>({...p,[ms.id]:""}));
                    }},"Add")
                  )
                )
              )
            );
          })
      ),

      // General Tasks
      e("div",{style:{...S.card,marginBottom:16}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
          e("div",{style:{fontSize:12,fontWeight:700,color:"#06b6d4",textTransform:"uppercase",letterSpacing:"0.06em"}},"✅ General Tasks"),
          e("button",{style:{...S.btn(),fontSize:11,padding:"5px 12px"},onClick:()=>setShowAddMgmtTask(true)},"+ Task")
        ),
        mgmtTasks.length===0
          ?e("div",{style:{fontSize:12,color:"#2a4a7f",padding:"8px 0"}},"No tasks yet")
          :mgmtTasks.map(t=>e("div",{key:t.id,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #071020"}},
            e("button",{style:{width:20,height:20,borderRadius:4,border:`2px solid ${t.status==="Done"?"#10b981":"#1e3a5f"}`,background:t.status==="Done"?"#10b98133":"transparent",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12},
              onClick:()=>setMgmtTasks(p=>p.map(mt=>mt.id===t.id?{...mt,status:mt.status==="Done"?"To Do":"Done"}:mt))
            },t.status==="Done"?"✓":""),
            e("div",{style:{flex:1}},
              e("div",{style:{fontSize:13,color:t.status==="Done"?"#4a6fa5":"#cbd5e1",textDecoration:t.status==="Done"?"line-through":"none"}},t.task),
              t.assignee&&e("div",{style:{fontSize:11,color:"#4a6fa5",marginTop:2}},"👤 "+t.assignee)
            ),
            e("button",{style:{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:12,padding:"2px 6px"},
              onClick:()=>setMgmtTasks(p=>p.filter(mt=>mt.id!==t.id))},"×")
          ))
      ),

      // General Expenses link
      genProj&&e("div",{style:{...S.card,marginBottom:16,cursor:"pointer"},onClick:()=>{setActiveId(genProj.id);setExpenses([]);setReloadTick(t=>t+1);navTo("expenses");}},
        e("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
          e("div",{style:{display:"flex",alignItems:"center",gap:10}},
            e("div",{style:{fontSize:20}},"💼"),
            e("div",null,
              e("div",{style:{fontWeight:700,color:"#f8f0d8",fontSize:13}},"General Expenses"),
              e("div",{style:{fontSize:11,color:"#4a6fa5",marginTop:2}},"Company-wide expenses")
            )
          ),
          e("span",{style:{color:"#d4a017",fontSize:13,fontWeight:600}},"View →")
        )
      ),

      // Completed Projects
      completed.length>0&&e("div",{style:{...S.card,marginBottom:16}},
        e("div",{style:{fontSize:12,fontWeight:700,color:"#10b981",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}},"✅ Completed Projects"),
        completed.map(p=>e("div",{key:p.id,style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #1e3a5f",cursor:"pointer"},
          onClick:()=>{setActiveId(p.id);setExpenses([]);setTasks([]);setQuotes([]);setReloadTick(t=>t+1);navTo("dashboard");}},
          e("div",null,
            e("div",{style:{fontWeight:700,color:"#f8f0d8",fontSize:13}},p.name),
            e("div",{style:{fontSize:11,color:"#4a6fa5",marginTop:2}},p.description?.split("|")[0]?.trim()||"Fix & Flip")
          ),
          e("span",{style:{fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:99,background:"#ef444422",color:"#ef4444"}},"Sold")
        ))
      ),

      // Modals
      showAddMgmtMs&&e(AddMgmtMsModal,{key:"add-mgmt-ms-modal"}),
      editMgmtMs&&e(EditMgmtMsModal,{key:"edit-mgmt-ms-modal",msId:editMgmtMs}),
      showAddMgmtTask&&e(AddMgmtTaskModal,{key:"add-mgmt-task-modal"})
    );
  };

  return e("div",{style:S.root},
    e("div",{style:S.header},
      e("div",{style:{fontWeight:800,fontSize:15,color:"#f8f0d8",display:"flex",alignItems:"center",gap:8,cursor:"pointer"},onClick:()=>navTo("home"),className:"header-title"},
        e("div",{style:{width:28,height:28,background:"#1e3a5f",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#d4a017",flexShrink:0}},"N"),
        "NextPhase Ventures"
      ),
      saving&&e("span",{style:{fontSize:12,color:"#d4a017",marginLeft:4}},"Saving…"),
      activeProject&&view!=="home"&&e("div",{style:{marginLeft:"auto"}},
        e("button",{style:{...S.btn(),fontSize:13},onClick:()=>view==="tasks"?openAddTask():view==="quotes"?openAddQuote():openAddExpense()},view==="tasks"?"+ Task":view==="quotes"?"+ Quote":"+ Add")
      )
    ),

    e("div",{style:{display:"flex",flex:1,minHeight:0}},
      e(Sidebar),
      e("div",{style:{...S.content},className:"main-content"},
        view==="home"      ?e(HomeView):
        view==="management"?e(ManagementView):
        view==="vendors"   ?e(VendorsView):
        view==="dashboard" ?e(DashboardView):
        view==="expenses"  ?e(ExpensesView,{key:"expenses"}):
        view==="tasks"     ?e(TasksView,{key:"tasks"}):
        view==="quotes"    ?e(QuotesView,{key:"quotes"}):
        view==="planning"  ?e(PlanningView,{key:"planning"}):
        view==="leads"     ?e(LeadsView):null
      )
    ),

    e(BottomNav),
    e("div",{style:{background:"#071020",borderTop:"1px solid #1e3a5f",padding:"7px 16px",textAlign:"center",flexShrink:0}},e("span",{style:{fontSize:10,color:"#2a4a7f",fontFamily:"system-ui,sans-serif",letterSpacing:"0.04em"}},"Powered by BuildFlow — Weblina LLC")),

    delConfirm&&e("div",{style:{position:"fixed",inset:0,background:"#000c",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50,padding:16}},
      e("div",{style:{...S.card,maxWidth:360,width:"100%"}},
        e("div",{style:{fontWeight:700,fontSize:16,marginBottom:8,color:"#f8f0d8"}},"Delete "+(delConfirm.type==="project"?"Project":delConfirm.type==="task"?"Task":delConfirm.type==="quote"?"Quote":"Expense")+"?"),
        e("p",{style:{fontSize:13,color:"#4a6fa5",marginBottom:20}},'"'+delConfirm.name+'" will be permanently removed'+(delConfirm.type==="project"?" and all its expenses":"")+"."),
        e("div",{style:{display:"flex",gap:8,justifyContent:"flex-end"}},
          e("button",{style:S.btn("ghost"),onClick:()=>setDelConfirm(null),disabled:saving},"Cancel"),
          e("button",{style:S.btn("danger"),disabled:saving,onClick:()=>delConfirm.type==="project"?deleteProject(delConfirm.id):delConfirm.type==="task"?deleteTask(delConfirm.id):delConfirm.type==="quote"?deleteQuote(delConfirm.id):
                delConfirm.type==="lead"?deleteLead(delConfirm.id):deleteExpense(delConfirm.id)},saving?"Deleting…":"Delete")
        )
      )
    ),

    toast&&e("div",{style:{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:toast.type==="error"?"#ef4444":"#10b981",color:"#fff",padding:"10px 20px",borderRadius:8,fontSize:13,fontWeight:600,zIndex:100,boxShadow:"0 4px 20px #0006",whiteSpace:"nowrap"}},toast.msg)
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(e){return {error:e.message};}
  render(){
    if(this.state.error) return React.createElement("div",{style:{padding:32,color:"#ef4444",fontFamily:"monospace",fontSize:13,background:"#0a1628",minHeight:"100vh"}},
      React.createElement("div",{style:{fontWeight:700,fontSize:18,marginBottom:12}},"⚠️ App Error"),
      React.createElement("pre",{style:{whiteSpace:"pre-wrap",wordBreak:"break-all"}},this.state.error)
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(App)));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
//]]>
</script>
</body>
</html>
